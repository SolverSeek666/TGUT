<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="format-detection" content="telephone=no">
  <title>The Googology Upgrade Tree</title>
  
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap" rel="stylesheet">
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/14.0.1/math.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/break_eternity.js"></script>
  
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <div id="game">
    <div id="numberContainer">
      <div id="number">
        0
      </div>
      <br>
      <div id="rate">
        +0.000/s
      </div>
    </div>
    <div class="game-body">
      
      <div class="negpanel">
        <button id="upgrade-neg10" class="upgrade-btn" onclick="UPneg10()">
          <div class="btn-header">Upgrade -10</div>
          <div class="btn-main">
            <div class="btn-info">
              <div class="btn-tier">Genesis</div>
              <div id="upneg10-buy-count" class="btn-buy-count">Buy: 0/10</div>
            </div>
            <div class="btn-description">
              Increase number<br>
            </div>
          </div>
          <div id="upneg10-cost" class="btn-cost">
            Cost: 0 Numbers
          </div>
        </button>
      </div>
      
      <div class="negpanel" style="display: none">
        <button id="upgrade-neg9" class="upgrade-btn" onclick="UPneg9()">
          <div class="btn-header">Upgrade -9</div>
          <div class="btn-main">
            <div class="btn-info">
              <div class="btn-tier">Genesis</div>
              <div id="upneg9-buy-count" class="btn-buy-count">Buy: 0/5</div>
            </div>
            <div class="btn-description">
              Increase number by 0.0000000001<br>
            </div>
          </div>
          <div id="upneg9-cost" class="btn-cost">
            Cost: 0.0000000001 Numbers
          </div>
        </button>
      </div>
      
      <div class="negpanel" style="display: none">
        <div class="placeholder-box">
          <p>WIP because yes</p>
        </div>
      </div>
      
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
