<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="format-detection" content="telephone=no">
  <title>The Googology Upgrade Tree</title>
  
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap" rel="stylesheet">
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/14.0.1/math.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/break_eternity.js"></script>
  
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <div id="game">
    <div id="numberContainer">
      <div id="number">
        0
      </div>
      <br>
      <div id="rate">
        +0.000/s
      </div>
    </div>
    <div class="panel">
      <button id="upgrade-1" class="upgrade-btn">
        <div class="btn-header">Upgrade 1</div>
        <div class="btn-main">
          <div class="btn-info">
            <div class="btn-tier">Genesis</div>
            <div class="btn-buy-count">Buy: 0/10</div>
          </div>
          <div class="btn-description">
            Increase number<br>
          </div>
        </div>
        <div class="btn-cost" id="upgrade-1-cost">
          Cost: 0 Numbers
        </div>
      </button>
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
